# Fleet Workflow Guards
#
# repo-maintenance のワークフロー検査を、直近いじったリポジトリ全体に対して実行する。
# 検査は bash と awk だけで動き、対象リポジトリのワークフロー YAML を読むだけなので、
# 各リポジトリへスクリプトを配布せずここから一括で走らせられる。検査を直せば次回の
# 実行から全リポジトリへ反映される。
#
# 走査は読み取りのみ。対象リポジトリへ Issue や PR は作らない。
name: Fleet Workflow Guards

on:
  schedule:
    - cron: '0 22 * * 0' # 毎週月曜 07:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: '対象とする最終 push からの日数'
        required: false
        default: '90'
      owners:
        description: '走査する GitHub オーナー（空白区切り）'
        required: false
        default: 'keito4 Elu-co-jp OYKOT-jp'
      repos:
        description: '走査するリポジトリ名（空白区切り）。空なら自動検出。指定時は owners を1つに絞ること'
        required: false
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # 他リポジトリを読むため PAT が要る。GITHUB_TOKEN は自リポジトリしか見えない。
      - name: Run workflow guards across repositories
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PAT }}
          FLEET_DAYS: ${{ inputs.days || '90' }}
          FLEET_OWNERS: ${{ inputs.owners || 'keito4 Elu-co-jp OYKOT-jp' }}
          FLEET_REPOS: ${{ inputs.repos || '' }}
        run: |
          set -u
          # リポジトリ名はオーナーを跨いで一意ではない（notion_mcp は keito4 と OYKOT-jp の
          # 両方にある）。--repos を複数オーナーへ配ると別物を走査してしまう。
          if [ -n "$FLEET_REPOS" ] && [ "$(printf '%s\n' $FLEET_OWNERS | wc -l)" -ne 1 ]; then
            echo "::error::repos を指定するときは owners を1つに絞ってください" >&2
            exit 1
          fi

          # 1 オーナーの違反で残りの走査を打ち切ると、全体の実態が分からないまま直すことになる。
          status=0
          for owner in $FLEET_OWNERS; do
            args=(--owner "$owner" --days "$FLEET_DAYS")
            if [ -n "$FLEET_REPOS" ]; then
              args+=(--repos "$FLEET_REPOS")
            fi
            script/fleet-workflow-guards.sh "${args[@]}" || status=1
          done
          exit "$status"
