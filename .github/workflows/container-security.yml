name: Container Security Scan

on:
  push:
    branches: [main, pre-production, production]
    paths:
      - '.devcontainer/**'
      - 'npm/global.json'
  pull_request:
    branches: [main, pre-production, production]
    paths:
      - '.devcontainer/**'
      - 'npm/global.json'
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - name: Free disk space before scan
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          docker system prune -af --volumes
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-docker-build
        with:
          qemu: 'false'
          login: 'false'

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: config-base:scan
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/config-base:cache

      - name: Run Trivy vulnerability scanner
        # ignore-unfixed: 修正版が未提供の CVE を抑制する。主に Ubuntu 24.04 (Noble)
        #   ベースイメージ由来の linux-libc-dev カーネル CVE が対象で、Ubuntu が
        #   "needed" のまま fixed version を出さないため、イメージ再ビルドのたびに
        #   新しい CRITICAL が湧き .trivyignore へのいたちごっこになる。
        #   修正版が存在する CVE (grpc-go, protobufjs, Vercel CLI 等) は引き続き
        #   検出され、.trivyignore で個別に管理する。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: 'config-base:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          ignore-unfixed: 'true'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Summarize Trivy results and fail on critical vulnerabilities
        id: summary
        if: always()
        run: |
          if [ ! -s trivy-results.sarif ]; then
            echo "::warning::trivy-results.sarif was not generated"
            exit 0
          fi

          count_by_severity() {
            local min=$1
            local max=$2
            jq --argjson min "$min" --argjson max "$max" '
              [
                .runs[] as $run
                | (
                    $run.tool.driver.rules // []
                    | map({key: .id, value: (.properties."security-severity" // "0")})
                    | from_entries
                  ) as $severities
                | ($run.results // [])[]
                | (.ruleId // "") as $rule_id
                | ($severities[$rule_id] // "0" | tostring | tonumber) as $score
                | select($score >= $min and $score < $max)
              ]
              | length
            ' trivy-results.sarif
          }

          CRITICAL_COUNT=$(count_by_severity 9 100)
          HIGH_COUNT=$(count_by_severity 7 9)
          MEDIUM_COUNT=$(count_by_severity 4 7)

          {
            echo "### Trivy Container Scan"
            echo ""
            echo "| Severity | Count |"
            echo "| --- | ---: |"
            echo "| Critical | $CRITICAL_COUNT |"
            echo "| High | $HIGH_COUNT |"
            echo "| Medium | $MEDIUM_COUNT |"
          } >> "$GITHUB_STEP_SUMMARY"

          # critical_count は通知ステップが「CVE 起因の失敗」と
          # 「インフラ起因の失敗（ビルド失敗等）」を撃ち分けるために使う。
          echo "critical_count=$CRITICAL_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Trivy found $CRITICAL_COUNT critical vulnerabilities"
            exit 1
          fi

      # なぜ必要か: このジョブは paths フィルタ付き (.devcontainer/**, npm/global.json) で
      #   通常の PR では走らず、branch protection の必須チェックにも入っていない。
      #   そのため main が red になっても誰も気づかない。実際 2026-09-01 から 09-08 まで
      #   CRITICAL 1件 (CVE-2026-56854) を検知したまま一週間放置された (#1236)。
      #   PR での失敗は PR 上で見えるので、スケジュール実行と main への push だけ通知する。
      #
      # 失敗の種別で title を分ける理由: failure() はビルド失敗や SARIF アップロード
      #   失敗でも真になる。CVE 起因とインフラ起因を同じ title にすると、重複抑止が
      #   title 一致で効くため、開いたままのインフラ障害 Issue が後続の本物の CRITICAL
      #   検知を握り潰す。既存 Issue がある場合も run URL をコメントで積んで、
      #   最初の1件だけが残って古い run を指し続ける状態を避ける。
      - name: Post failure issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          CRITICAL_COUNT: ${{ steps.summary.outputs.critical_count }}
        run: |
          # critical_count が空 = summarize に到達する前（または SARIF 未生成）で落ちた
          # = インフラ起因。数値が入っていて 0 より大きいときだけ CVE 起因とみなす。
          if [ -n "$CRITICAL_COUNT" ] && [ "$CRITICAL_COUNT" -gt 0 ]; then
            TITLE="fix: Container Security Scan found critical vulnerabilities"
            DETAIL=$(cat <<EOF
          CRITICAL (security-severity >= 9) を ${CRITICAL_COUNT} 件検出しました。
          放置すると config-base を使う全リポジトリへ脆弱性が配られ続けます。

          ### 対応手順

          1. 該当 CVE を特定する。code scanning alerts (tool_name=Trivy, state=open) のうち
             rule.security_severity_level が critical のものがゲートを落としている。
          2. 修正版が出ているなら .devcontainer/Dockerfile のバージョンを上げる。
          3. 上流が未対応（クローズドソースのバイナリ等）なら .trivyignore に
             理由と Review date 付きで追記する。
          EOF
          )
          else
            TITLE="fix: Container Security Scan failed to run"
            DETAIL=$(cat <<EOF
          スキャン自体が完走しませんでした（イメージビルド、Trivy 実行、SARIF
          アップロード等の失敗）。CRITICAL が検出されたわけではありません。

          ### 対応手順

          1. 上の Run のログで、どのステップが落ちたかを確認する。
          2. ディスク容量やレジストリキャッシュ等の一時的な要因なら再実行する。
          3. 再現するならワークフロー側の問題として調査する。

          スキャン結果が未検証のままである点に注意してください。
          EOF
          )
          fi

          BODY=$(cat <<EOF
          ## ${TITLE#fix: }

          ${DETAIL}

          **Run:** ${RUN_URL}
          **Trigger:** ${TRIGGER}

          ---
          *Auto-generated by [container-security.yml](.github/workflows/container-security.yml)*
          EOF
          )

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            # 同種の Issue が既に開いている。新しい run を追記して、最初の1件が
            # 古い run URL を指したまま取り残されるのを防ぐ。
            echo "Issue #$EXISTING is already open. Appending this run."
            gh issue comment "$EXISTING" --body "再発しました。

          **Run:** ${RUN_URL}
          **Trigger:** ${TRIGGER}"
            exit 0
          fi

          LABEL_ARGS=()
          if gh label list --json name --jq '.[].name' | grep -Fxq "security"; then
            LABEL_ARGS=(--label "security")
          fi

          gh issue create \
            --title "$TITLE" \
            "${LABEL_ARGS[@]}" \
            --body "$BODY"

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read

    steps:
      - name: Free disk space before SBOM generation
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          docker system prune -af --volumes
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-docker-build
        with:
          qemu: 'false'
          login: 'false'

      - name: Build image for SBOM
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: config-base:sbom
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/config-base:cache

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: config-base:sbom
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
