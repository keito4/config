name: Sync Downstream Repositories

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.claude/hooks/**'
      - '.claude/rules/**'
      - '.claude/settings.json'
      - '.github/sync-downstream.json'
      - 'script/sync-downstream.js'
      - '.github/workflows/sync-downstream.yml'
  # PAT の失効はテンプレート更新の push が来るまで表に出ない。週次で生存だけ確認する。
  schedule:
    - cron: '0 21 * * 0' # 毎週月曜 06:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report differences without creating PRs'
        type: boolean
        default: false
      repo:
        description: 'Limit to a single repository (owner/name)'
        required: false
        type: string

concurrency:
  group: sync-downstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # downstream の checkout と PR 作成はどちらも CLAUDE_PAT に乗っている。失効すると
  # matrix の全 job が checkout 内部で `Bad credentials` を出して落ちるだけで、どの
  # シークレットをどう直せばよいかログから読み取れない。先に一度だけ検証して止める。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate downstream token
        env:
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
        run: |
          if [ -z "$CLAUDE_PAT" ]; then
            echo "::error::CLAUDE_PAT secret is not configured. Create a token with the 'repo' and 'workflow' scopes and register it with: gh secret set CLAUDE_PAT --repo ${{ github.repository }}"
            exit 1
          fi

          headers="$RUNNER_TEMP/pat-headers.txt"
          status=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $CLAUDE_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)

          if [ "$status" != "200" ]; then
            echo "::error::CLAUDE_PAT was rejected by https://api.github.com/user (HTTP $status). The token is expired or revoked. Reissue it with the 'repo' and 'workflow' scopes and register it with: gh secret set CLAUDE_PAT --repo ${{ github.repository }}"
            exit 1
          fi

          # classic PAT のときだけ返る。workflow スコープが無いと downstream の
          # .github/workflows/ を書き換える PR だけが後段で落ちる。
          scopes=$(grep -i '^x-oauth-scopes:' "$headers" | cut -d: -f2- | tr -d ' \r' || true)
          if [ -n "$scopes" ] && ! printf '%s' ",$scopes," | grep -q ',workflow,'; then
            echo "::warning::CLAUDE_PAT is missing the 'workflow' scope (has: $scopes). Pull requests touching downstream .github/workflows/ will be rejected."
          fi

          echo "CLAUDE_PAT accepted by the GitHub API."

  plan:
    needs: preflight
    # 定期実行はトークンの生存確認だけが目的。downstream PR は push と手動実行で作る。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repos: ${{ steps.matrix.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build repository matrix from manifest
        id: matrix
        env:
          REPO_FILTER: ${{ inputs.repo }}
        run: |
          repos=$(node --eval '
            const manifest = require("./.github/sync-downstream.json");
            const filter = process.env.REPO_FILTER;
            const names = manifest.repos.map((repo) => repo.name).filter((name) => !filter || name === filter);
            console.log(JSON.stringify(names));
          ')
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  sync:
    needs: [preflight, plan]
    if: needs.plan.outputs.repos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.CLAUDE_PAT }}
          path: downstream

      - name: Sync managed files into downstream checkout
        env:
          SYNC_REPO: ${{ matrix.repo }}
          DRY_RUN: ${{ inputs.dry_run == true && '--check' || '' }}
        run: node script/sync-downstream.js --repo "$SYNC_REPO" --target downstream $DRY_RUN

      - name: Create sync pull request
        if: ${{ inputs.dry_run != true }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CLAUDE_PAT }}
          path: downstream
          branch: chore/config-template-sync
          delete-branch: true
          commit-message: 'chore: keito4/config の管理テンプレートを同期'
          title: 'chore: keito4/config の管理テンプレートを同期'
          body: |
            keito4/config で管理しているテンプレート・`.claude/` アセットの自動同期です。

            - 同期元コミット: keito4/config@${{ github.sha }}
            - 同期対象は [.github/sync-downstream.json](https://github.com/keito4/config/blob/main/.github/sync-downstream.json) で管理されています
            - このリポジトリ固有の変更を維持したい場合は、manifest の `exclude` にパスを追加してください

            ---

            **Auto-generated by:** [sync-downstream.yml](https://github.com/keito4/config/blob/main/.github/workflows/sync-downstream.yml)

  # 失敗通知が無かったせいで、CLAUDE_PAT 失効後の全 run が誰にも気付かれずに赤いまま
  # 積み上がった。scheduled-maintenance.yml と同じ型で issue を立てる。
  notify:
    needs: [preflight, plan, sync]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOKEN_RESULT: ${{ needs.preflight.result }}
        run: |
          TITLE="fix: Sync Downstream Repositories failed"

          # 同じ失敗で issue を積み上げない。
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open sync-downstream issue already exists. Skipping."
            exit 0
          fi

          CAUSE="See the run log for the failing step."
          if [ "$TOKEN_RESULT" = "failure" ]; then
            CAUSE="The \`CLAUDE_PAT\` secret is missing or was rejected by the GitHub API. Reissue a token with the \`repo\` and \`workflow\` scopes and register it with \`gh secret set CLAUDE_PAT --repo $GH_REPO\`."
          fi

          gh issue create \
            --title "$TITLE" \
            --body "## Sync Downstream Failure

          Template distribution to the repositories in [.github/sync-downstream.json](https://github.com/${{ github.repository }}/blob/main/.github/sync-downstream.json) is not running.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Token check:** \`$TOKEN_RESULT\`

          $CAUSE

          ---
          *Auto-generated by [sync-downstream.yml](.github/workflows/sync-downstream.yml)*"
