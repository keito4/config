name: CI

on:
  pull_request:
    branches: [main, master, pre-production, production]
    paths:
      - '**.js'
      - '**.ts'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - '**.bats'
      - '.takt/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc.*'
      - '.prettierrc.*'
      - 'tsconfig.json'
  push:
    branches: [main, master, pre-production, production]
    paths:
      - '**.js'
      - '**.ts'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - '**.bats'
      - '.takt/**'
      - '.github/actions/**'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc.*'
      - '.prettierrc.*'
      - 'tsconfig.json'
  schedule:
    # 毎週月曜 05:00 JST。macOS ランナーでのみ BSD userland 起因の退行を検出する。
    - cron: '0 20 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 週次実行は macOS の退行検出だけが目的。paths-filter は schedule に差分基準が
    # ないため、ここで止めて ubuntu 側のジョブごとスキップさせる。
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflows: ${{ steps.filter.outputs.workflows }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - '**.js'
              - '**.ts'
              - '**.mjs'
              - '**.cjs'
              - 'src/**'
              - 'test/**/*.test.{js,ts}'
              - 'tsconfig.json'
            scripts:
              - '**.sh'
              - 'script/**'
              - 'test/integration/**'
            workflows:
              - '.github/actions/**'
              - '.github/workflows/**'
              - '.github/actionlint.yaml'
              - '.takt/**'
              - '.github/labels.yml'
              - 'templates/workflows/**'
              - 'templates/github/labels.yml'
              - 'script/check-workflow-template-sync.js'
            dependencies:
              - 'package.json'
              - 'package-lock.json'

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-ci

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ESLint
        run: npm run lint

      - name: Check shell scripts
        run: npm run shellcheck

      - name: Check formatting
        run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: ./reports/junit.xml
          retention-days: 30

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        continue-on-error: true
        with:
          name: Jest Test Results
          path: ./reports/junit.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Detect Codecov token
        id: codecov-token
        if: always()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always() && steps.codecov-token.outputs.available == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-ci

      - name: Install bats and zsh
        run: sudo apt-get update && sudo apt-get install -y bats zsh

      - name: Run Bats integration tests
        run: |
          mkdir -p reports
          bats test/integration/*.bats --formatter tap > reports/bats-results.tap

      - name: Upload integration test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: ./reports/bats-results.tap
          retention-days: 30

  integration-test-macos:
    name: Integration Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    # macos-latest は Actions の課金係数が ubuntu-latest の 10 倍のため PR ごとには回さない。
    # BSD userland (sed / mktemp / realpath 等) 起因の退行は main への push と週次実行で検出する。
    # paths-filter に依存しないのは、schedule には差分の基準が存在しないため。
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-ci

      # zsh は macOS 同梱なので不要。bash は同梱が 3.2 で script/lib/output.sh の
      # 4.3+ 要件を満たさないため brew 版を入れ、PATH の先頭に置く。
      - name: Install bats and bash
        run: |
          brew install bats-core bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify bash version
        run: |
          bash --version | head -1
          bash -c '[[ "${BASH_VERSINFO[0]}" -ge 4 ]]'

      # ubuntu 側と違いリダイレクトではなく tee にする。macOS 固有の失敗は
      # artifact を落とさないと読めないと切り分けが遅いため、ログにも出す。
      - name: Run Bats integration tests
        run: |
          mkdir -p reports
          bats test/integration/*.bats --formatter tap | tee reports/bats-results.tap

      - name: Upload integration test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-test-results-macos
          path: ./reports/bats-results.tap
          retention-days: 30

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Collect workflow files
        id: workflow-files
        shell: bash
        run: |
          mkdir -p .context
          {
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \)
            find .github/workflows/templates -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null || true
            find templates/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null || true
          } | sort > .context/actionlint-files.txt

          {
            echo "files<<EOF"
            tr '\n' ' ' < .context/actionlint-files.txt
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        uses: reviewdog/action-actionlint@320fcdd9c860767cf17fab3b20e22e739d5d02b8 # v1.76.0
        with:
          reporter: github-pr-review
          fail_level: error
          actionlint_flags: ${{ steps.workflow-files.outputs.files }}

      # actionlint が拾わない、CI が緑のまま実害だけが出る不具合を PR で止める。
      # 週次メンテナンスの警告だけでは退行を含む PR がマージできてしまう。
      - name: Run workflow guards
        run: |
          guard_status=0
          for check in \
            --check-claude-action-credentials \
            --check-claude-token-guard \
            --check-self-cancelling-workflows \
            --check-gh-repo-context \
            --check-artifact-retention; do
            script/repo-maintenance.sh "$check" || guard_status=1
          done
          exit "$guard_status"

  workflow-template-sync:
    name: Workflow Template Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.scripts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-ci

      - name: Check workflow templates match actual workflows
        run: npm run workflow:sync:check

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check PR Size
        uses: ./.github/actions/pr-size-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [changes, lint, test, integration-test, integration-test-macos, actionlint, workflow-template-sync, pr-size-check]
    if: always()
    steps:
      - name: Check job results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          INTEGRATION_MACOS_RESULT: ${{ needs.integration-test-macos.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          WORKFLOW_TEMPLATE_SYNC_RESULT: ${{ needs.workflow-template-sync.result }}
          PR_SIZE_RESULT: ${{ needs.pr-size-check.result }}
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | $LINT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | $TEST_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | $INTEGRATION_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests (macOS) | $INTEGRATION_MACOS_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Lint | $ACTIONLINT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Template Sync | $WORKFLOW_TEMPLATE_SYNC_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Size | $PR_SIZE_RESULT |" >> $GITHUB_STEP_SUMMARY

      - name: Verify all checks passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          INTEGRATION_MACOS_RESULT: ${{ needs.integration-test-macos.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          WORKFLOW_TEMPLATE_SYNC_RESULT: ${{ needs.workflow-template-sync.result }}
          PR_SIZE_RESULT: ${{ needs.pr-size-check.result }}
        run: |
          # skipped は成功扱い（該当ファイルの変更がない場合）
          function check_result() {
            local result=$1
            [[ "$result" == "success" || "$result" == "skipped" ]]
          }

          FAILED=false
          if ! check_result "$LINT_RESULT"; then
            echo "::error::Lint & Format failed"
            FAILED=true
          fi
          if ! check_result "$TEST_RESULT"; then
            echo "::error::Unit Tests failed"
            FAILED=true
          fi
          if ! check_result "$INTEGRATION_RESULT"; then
            echo "::error::Integration Tests failed"
            FAILED=true
          fi
          if ! check_result "$INTEGRATION_MACOS_RESULT"; then
            echo "::error::Integration Tests (macOS) failed"
            FAILED=true
          fi
          if ! check_result "$ACTIONLINT_RESULT"; then
            echo "::error::Workflow Lint failed"
            FAILED=true
          fi
          if ! check_result "$WORKFLOW_TEMPLATE_SYNC_RESULT"; then
            echo "::error::Workflow Template Sync failed"
            FAILED=true
          fi
          if ! check_result "$PR_SIZE_RESULT"; then
            echo "::error::PR Size gate failed (>400 lines or >25 files; apply size/override to bypass)"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo "::error::Quality gate failed - one or more jobs did not succeed"
            exit 1
          fi

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-gate]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          channel-id: ${{ vars.SLACK_CI_CHANNEL_ID }}
          payload-template-file-path: '.github/slack-ci-failure.json'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        continue-on-error: true
