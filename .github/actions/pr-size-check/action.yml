name: 'PR Size Check'
description: 'Apply a size label to pull requests and fail on diffs beyond the hard limit (400 lines / 25 files)'

inputs:
  github-token:
    description: 'GitHub token used to update labels and comments'
    required: true
  max-lines:
    description: 'Hard limit for total changed lines (additions + deletions)'
    required: false
    default: '400'
  max-files:
    description: 'Hard limit for changed files'
    required: false
    default: '25'
  override-label:
    description: 'Label that bypasses the hard limit (must be applied by a human reviewer)'
    required: false
    default: 'size/override'

runs:
  using: 'composite'
  steps:
    - name: Check PR Size
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pullRequest = context.payload.pull_request;
          if (!pullRequest) {
            core.info('PR size check skipped: event payload has no pull_request.');
            return;
          }

          const maxLines = parseInt('${{ inputs.max-lines }}', 10);
          const maxFiles = parseInt('${{ inputs.max-files }}', 10);
          const overrideLabel = '${{ inputs.override-label }}';

          const { additions, deletions, changed_files } = pullRequest;
          const totalChanges = additions + deletions;

          const sizes = [
            { label: 'size/XS', maxLines: 50, maxFiles: 3 },
            { label: 'size/S', maxLines: 200, maxFiles: 10 },
            { label: 'size/M', maxLines: 500, maxFiles: 15 },
            { label: 'size/L', maxLines: 1000, maxFiles: 30 },
          ];

          let sizeLabel = 'size/XL';
          for (const size of sizes) {
            if (totalChanges <= size.maxLines && changed_files <= size.maxFiles) {
              sizeLabel = size.label;
              break;
            }
          }

          // Read labels via API, not from the event payload: on a workflow re-run the
          // payload is a stale snapshot and would miss a freshly applied override label.
          const { data: liveLabels } = await github.rest.issues
            .listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            .catch(() => ({ data: pullRequest.labels }));
          const currentLabels = liveLabels.map((label) => label.name);

          // Labeling and comments are best-effort (may lack permission on forks);
          // the hard gate below must still run, so every API call is wrapped.
          for (const label of currentLabels) {
            if (label.startsWith('size/') && label !== overrideLabel) {
              await github.rest.issues
                .removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                })
                .catch(() => {});
            }
          }

          await github.rest.issues
            .addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sizeLabel],
            })
            .catch(() => {});

          core.info(`PR Size: ${sizeLabel} (${totalChanges} lines, ${changed_files} files)`);

          const overLimit = totalChanges > maxLines || changed_files > maxFiles;
          if (!overLimit) {
            return;
          }

          if (currentLabels.includes(overrideLabel)) {
            core.warning(
              `PR exceeds the size limit (${totalChanges} lines / ${changed_files} files > ` +
                `${maxLines} lines / ${maxFiles} files) but has the '${overrideLabel}' label. Passing.`
            );
            return;
          }

          const body = `## PR Size Gate Failed

          This PR changes **${totalChanges} lines** across **${changed_files} files**, exceeding the hard limit of **${maxLines} lines / ${maxFiles} files**.

          Options:
          - Split this into smaller, focused PRs (preferred)
          - Separate refactoring from feature changes
          - If the size is unavoidable (e.g. generated code, lockfiles, bulk renames), ask a reviewer to apply the \`${overrideLabel}\` label and re-run the check

          **PR Size Labels (informational):**
          | Size | Lines | Files |
          |------|-------|-------|
          | XS | <=50 | <=3 |
          | S | <=200 | <=10 |
          | M | <=500 | <=15 |
          | L | <=1000 | <=30 |
          | XL | >1000 | >30 |`;

          const { data: comments } = await github.rest.issues
            .listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            .catch(() => ({ data: [] }));
          const alreadyCommented = comments.some(
            (c) => c.body && c.body.includes('## PR Size Gate Failed')
          );
          if (!alreadyCommented) {
            await github.rest.issues
              .createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
              .catch(() => {});
          }

          core.setFailed(
            `PR size gate failed: ${totalChanges} lines / ${changed_files} files ` +
              `(limit: ${maxLines} lines / ${maxFiles} files). ` +
              `Split the PR or have a reviewer apply the '${overrideLabel}' label.`
          );
