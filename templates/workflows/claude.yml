# Claude Code ワークフロー
#
# Issue や PR で @claude をメンションすると Claude Code が応答する。
# Bot からのイベントは自動除外。
# PR イベントと PR 上の issue_comment では Draft PR も除外。
#
# 使い方:
#   .github/workflows/claude.yml にコピーして配置
#   リポジトリ Secret に CLAUDE_CODE_OAUTH_TOKEN を設定
#
# カスタマイズ:
#   - timeout-minutes: タイムアウト（デフォルト: 30分）
#   - runs-on: リポジトリ変数 CLAUDE_RUNNER で変更（例: self-hosted、未設定なら ubuntu-latest）
#   - allowed_tools: Claude に許可するツール
#   - claude_args: 追加の system prompt 等
#
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  # Serialize trusted Issue requests through finalization; skipped events stay separate.
  group: >-
    claude-${{ github.repository }}-${{
      github.event.issue.number && !github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association) &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@claude')) ||
       (github.event_name == 'issues' && (contains(github.event.issue.body || '', '@claude') || contains(github.event.issue.title || '', '@claude')))) &&
      format('issue-{0}', github.event.issue.number) ||
      format('event-{0}', github.event.comment.id || github.event.review.id || github.run_id)
    }}
  cancel-in-progress: false
  queue: max

jobs:
  claude:
    # Bot 全般を除外し、信頼済み Association のみ許可
    # OWNER / MEMBER / COLLABORATOR: リポジトリ管理者・チームメンバー・招待コラボレーター
    if: |
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.review.author_association ||
        github.event.issue.author_association
      ) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body || '', '@claude') &&
          github.event.pull_request.draft == false) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@claude') &&
          github.event.pull_request.draft == false) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body || '', '@claude') || contains(github.event.issue.title || '', '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      task_complete: ${{ steps.claude-result.outputs.task_complete }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
      checks: read
    steps:
      - name: Check PR draft state
        id: pr_draft
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('is_draft', pull.draft ? 'true' : 'false');

      - name: Skip draft PR
        if: steps.pr_draft.outputs.is_draft == 'true'
        run: echo "Skipping Claude Code for draft PR."

      - name: Checkout repository
        if: steps.pr_draft.outputs.is_draft != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check Claude authentication
        id: claude-auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] ||
             [ -n "$ANTHROPIC_API_KEY" ] ||
             { [ -n "$ANTHROPIC_FEDERATION_RULE_ID" ] && [ -n "$ANTHROPIC_ORGANIZATION_ID" ]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude Code because no Claude authentication secret is configured."
          fi

      - name: Mark tracked Issue as working
        if: >-
          github.event.issue.number && !github.event.issue.pull_request &&
          steps.pr_draft.outputs.is_draft != 'true' &&
          steps.claude-auth.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const api = github.rest.issues;
            const issue = { ...context.repo, issue_number: context.issue.number };
            const { data } = await api.get(issue);
            const states = ['claude', 'claude-working', 'claude-blocked', 'claude-review'];
            const labels = data.labels.map(label => typeof label === 'string' ? label : label.name);
            const tracked = labels.filter(label => states.includes(label));
            if (data.state !== 'open' || !tracked.length) return;
            const target = 'claude-working';
            try { await api.getLabel({ ...context.repo, name: target }); }
            catch (error) {
              if (error.status !== 404) throw error;
              try {
                await api.createLabel({ ...context.repo, name: target, color: 'FBCA04' });
              } catch (creationError) {
                // Another Issue may create the same repository-wide label concurrently.
                if (creationError.status !== 422) throw creationError;
                await api.getLabel({ ...context.repo, name: target });
              }
            }
            await api.addLabels({ ...issue, labels: [target] });
            for (const name of tracked.filter(name => name !== target)) await api.removeLabel({ ...issue, name });
            core.info(`Issue #${issue.issue_number}: ${target}`);

      - name: Run Claude Code
        id: claude
        if: steps.pr_draft.outputs.is_draft != 'true' && steps.claude-auth.outputs.available == 'true'
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
            checks: read

          # System prompt to automatically create PRs when working on Issues
          claude_args: |
            --allowedTools "Bash(git:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr status:*),Bash(gh issue view:*),Bash(gh issue close:*),Bash(npm:*),Bash(pnpm:*),Bash(npx:*),Bash(make test:*),Bash(bash tests/*),Bash(bats:*)"
            --append-system-prompt "When working on GitHub Issues (not PRs), after completing all code changes, commit and push the changes to the Claude branch. Do not run 'gh pr create'; this workflow creates the pull request from the branch after Claude finishes. If your investigation of an Issue concludes that no code change is needed (the request is already satisfied, it is a duplicate, or it cannot be reproduced) and no human decision is pending, write the findings and the reason for closing in your comment, then close the Issue with 'gh issue close <number> --reason completed'. Keep the Issue open when you pushed changes, when a human decision or follow-up is needed, or when you are unsure. Await all delegated tasks and collect their results before ending. Post the requested findings or change summary in the tracking comment, including validation results. End the final comment with Claude task status: complete only when the requested work has been delivered and every required checklist item is complete. If blocked, post the exact blocker and next action with Claude task status: blocked; do not keep retrying the same denied operation or claim completion. Follow explicit requests for audit-only work: no code changes or PRs for those requests."

      - name: Verify Claude task completion
        id: claude-result
        if: >-
          !cancelled() && steps.claude.outcome != 'skipped' &&
          steps.pr_draft.outputs.is_draft != 'true' &&
          steps.claude-auth.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            core.setOutput('task_complete', false);
            const file = process.env.CLAUDE_EXECUTION_FILE || path.join(process.env.RUNNER_TEMP, 'claude-execution-output.json');
            const messages = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : [];
            const result = messages.findLast(message => message.type === 'result');
            const denied = {};
            for (const denial of result?.permission_denials || []) {
              const tool = /^(Bash|Read|Write|Edit|Glob|Grep|Agent|Task)$/.test(denial.tool_name) ? denial.tool_name : 'other';
              const command = String(denial.tool_input?.command || '').match(/^\s*(?:\S*\/)?(bash|sh|bats|make|python3?|node|npm|pnpm|npx|git|gh|rg|find|ls|cat|chmod)\b/)?.[1];
              const key = tool === 'Bash' ? `Bash:${command || 'other'}` : tool;
              denied[key] = (denied[key] || 0) + 1;
            }
            const knownErrors = ['authentication_failed', 'billing_error', 'rate_limit', 'server_error', 'invalid_request', 'max_output_tokens'];
            const errors = [...new Set(messages.filter(message => message.type === 'assistant' && message.error)
              .map(message => knownErrors.includes(message.error) ? message.error : 'unknown'))];
            core.info(JSON.stringify({ sdk_success: result?.subtype === 'success' && result?.is_error === false, denied, errors }));
            const inline = context.eventName === 'pull_request_review_comment';
            const comments = await github.paginate(inline ? github.rest.pulls.listReviewComments : github.rest.issues.listComments,
              { ...context.repo, [inline ? 'pull_number' : 'issue_number']: context.issue.number, per_page: 100 });
            const runLink = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const parts = messages.flatMap(message => Array.isArray(message.message?.content) ? message.message.content : []);
            const call = parts.findLast(part => part.type === 'tool_use' && part.name === 'mcp__github_comment__update_claude_comment');
            const receipt = call && parts.findLast(part => part.type === 'tool_result' && part.tool_use_id === call.id && !part.is_error);
            let data = receipt?.content;
            let commentId;
            for (let depth = 0; depth < 6 && data; depth++) {
              if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch { break; }
              } else if (Array.isArray(data)) {
                data = data.find(part => part.type === 'text')?.text;
              } else if (Number.isInteger(data.id)) {
                commentId = data.id;
                break;
              } else { data = data.content; }
            }
            const comment = comments.findLast(entry => entry.user?.login === 'claude[bot]' &&
              (commentId ? entry.id === commentId : entry.body?.includes(`(${runLink})`)));

            const body = comment?.body || '';
            let unchecked = true;
            let renderedComplete = false;
            if (body) {
              const { data: html } = await github.rest.markdown.render({
                text: body, mode: 'gfm', context: `${context.repo.owner}/${context.repo.repo}`,
              });
              if (typeof html !== 'string' || !/<[a-z][^>]*>/i.test(html)) throw new Error('GitHub Markdown rendering returned invalid HTML');
              renderedComplete = /(?:<p(?:\s[^>]*)?>|\n)Claude task status: complete\s*<\/p>\s*$/.test(html);
              unchecked = [...html.matchAll(/<input\b[^>]*>/gi)].some(([tag]) => {
                const attributes = new Map([...tag.matchAll(/([-\w]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+)))?/g)]
                  .map(([, name, double, single, bare]) => [name.toLowerCase(), double ?? single ?? bare ?? '']));
                return attributes.get('class')?.split(/\s+/).includes('task-list-item-checkbox') && !attributes.has('checked');
              });
            }
            const complete = result?.subtype === 'success' && result?.is_error === false && renderedComplete &&
              /(?:^|\n)Claude task status: complete\s*$/.test(body) &&
              !body.includes('Claude task status: blocked') && !unchecked;
            core.setOutput('task_complete', Boolean(complete));
            if (!complete) {
              core.setFailed('Claude task is incomplete or blocked. See the tracking comment and safe diagnostics above.');
              if (comment) {
                const updated = body.replace(/^\*\*Claude finished[^\n]*?\*\*/, '**Claude task incomplete**')
                  .replace(/<img[^>]*5ac382c7-e004-429b-8e35-7feb3e8f9c6f[^>]*\/>/g, '');
                await (inline ? github.rest.pulls.updateReviewComment : github.rest.issues.updateComment)(
                  { ...context.repo, comment_id: comment.id, body: `${updated}\n\nCompletion verification: incomplete or blocked; this run requires follow-up.` });
              }
            }

      - name: Create pull request from Claude branch
        if: >-
          !cancelled() && steps.claude.outcome != 'skipped' &&
          steps.claude-auth.outputs.available == 'true' &&
          (
            github.event_name == 'issues' ||
            (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
          )
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_PR_GITHUB_TOKEN || github.token }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          CLAUDE_TASK_COMPLETE: ${{ steps.claude-result.outputs.task_complete }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_ASSIGNEE: ${{ vars.CLAUDE_PR_ASSIGNEE }}
        run: |
          if [ -z "$CLAUDE_BRANCH" ]; then
            echo "Claude did not report a branch; publication cannot be verified."
            exit 1
          fi

          REMOTE_STATUS=0
          REMOTE_REF=$(git ls-remote --exit-code --heads origin "refs/heads/$CLAUDE_BRANCH") || REMOTE_STATUS=$?
          if [ "$REMOTE_STATUS" -ne 0 ] && [ "$REMOTE_STATUS" -ne 2 ]; then
            echo "Could not verify Claude branch $CLAUDE_BRANCH on origin."
            exit 1
          fi
          CLAUDE_HEAD=$(git rev-parse --verify "refs/heads/${CLAUDE_BRANCH}^{commit}")
          CURRENT_HEAD=$(git rev-parse --verify HEAD)
          WORKTREE_STATUS=$(git status --porcelain)
          if [ "$CURRENT_HEAD" != "$CLAUDE_HEAD" ] || [ -n "$WORKTREE_STATUS" ]; then
            echo "Claude left a different checkout or uncommitted changes."
            exit 1
          fi
          if [ "$REMOTE_STATUS" -eq 2 ]; then
            # The action creates a local branch even for read-only findings.
            # Only an absent remote ref plus verified, clean, unchanged work is a no-op.
            if [ "$CLAUDE_TASK_COMPLETE" = 'true' ]; then
              BASE_HEAD=$(git rev-parse --verify "refs/heads/${DEFAULT_BRANCH}^{commit}")
              if [ "$CLAUDE_HEAD" = "$BASE_HEAD" ]; then
                echo "Verified no-code result; no pull request is needed."
                exit 0
              fi
            fi
            echo "Claude branch $CLAUDE_BRANCH was not pushed."
            exit 1
          fi

          REMOTE_HEAD=$(printf '%s\n' "$REMOTE_REF" | cut -f1)
          if [ "$REMOTE_HEAD" != "$CLAUDE_HEAD" ]; then
            echo "Claude branch $CLAUDE_BRANCH has changes that are not published on origin."
            exit 1
          fi

          EXISTING_PR=$(gh pr list --head "$CLAUDE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $CLAUDE_BRANCH."
            exit 0
          fi

          TITLE="$ISSUE_TITLE"
          if [ -z "$TITLE" ]; then
            TITLE="Claude changes for issue #$ISSUE_NUMBER"
          fi

          ISSUE_ACTION="Closes"
          PR_ARGS=()
          if [ "$CLAUDE_TASK_COMPLETE" != 'true' ]; then
            ISSUE_ACTION="Refs"
            PR_ARGS=(--draft)
          fi
          BODY=$(printf "%s #%s\n\nCreated automatically from Claude Code branch \`%s\`. Task completion verified: %s. Check the Claude run before marking this PR ready." "$ISSUE_ACTION" "$ISSUE_NUMBER" "$CLAUDE_BRANCH" "$CLAUDE_TASK_COMPLETE")

          ASSIGNEE_ARGS=()
          if [ -n "$PR_ASSIGNEE" ]; then
            ASSIGNEE_ARGS=(--assignee "$PR_ASSIGNEE")
          fi

          gh pr create \
            --head "$CLAUDE_BRANCH" \
            --base "$DEFAULT_BRANCH" \
            --title "$TITLE" \
            --body "$BODY" \
            "${ASSIGNEE_ARGS[@]}" \
            "${PR_ARGS[@]}"

  finalize-issue:
    needs: claude
    if: >-
      always() && needs.claude.result != 'skipped' &&
      github.event.issue.number && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Finalize tracked Issue state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CLAUDE_RESULT: ${{ needs.claude.result }}
          CLAUDE_TASK_COMPLETE: ${{ needs.claude.outputs.task_complete }}
        with:
          script: |
            const api = github.rest.issues;
            const issue = { ...context.repo, issue_number: context.issue.number };
            const { data } = await api.get(issue);
            const states = ['claude', 'claude-working', 'claude-blocked', 'claude-review'];
            const labels = data.labels.map(label => typeof label === 'string' ? label : label.name);
            const tracked = labels.filter(label => states.includes(label));
            if (!tracked.length) return;
            const complete = process.env.CLAUDE_RESULT === 'success' && process.env.CLAUDE_TASK_COMPLETE === 'true';
            if (data.state !== 'open' && !complete) return;
            const target = data.state !== 'open' ? null : complete ? 'claude-review' : 'claude-blocked';
            if (target) {
              try { await api.getLabel({ ...context.repo, name: target }); }
              catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await api.createLabel({ ...context.repo, name: target, color: target === 'claude-review' ? '0E8A16' : 'D93F0B' });
                } catch (creationError) {
                  // Another Issue may create the same repository-wide label concurrently.
                  if (creationError.status !== 422) throw creationError;
                  await api.getLabel({ ...context.repo, name: target });
                }
              }
              await api.addLabels({ ...issue, labels: [target] });
            }
            for (const name of tracked.filter(name => name !== target)) await api.removeLabel({ ...issue, name });
            core.info(`Issue #${issue.issue_number}: ${target || 'completed; queue labels removed'}`);
            if (!complete) core.setFailed('Claude work is blocked; resolve the reported blocker before requesting a retry.');
