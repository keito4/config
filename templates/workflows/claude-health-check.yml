# Reference-only template; this repository does not install it under .github/workflows/.
#
name: Claude Code Health Check

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday 00:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # トークンが 1 つも設定されていないリポジトリでは、この検査に確かめるものが無い。
      # ガードせずに動かすと毎週「期限切れ」の Issue を作り続け、本当に失効したときの
      # 通知が埋もれる。
      - name: Check Claude authentication
        id: claude-auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the health check because no Claude authentication secret is configured."
          fi

      - name: Check Claude Code token validity
        id: check
        if: steps.claude-auth.outputs.available == 'true'
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1.0.181
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API キーだけを設定したリポジトリでも検査が成立するように渡す。渡さないと
          # available=true なのに認証情報が届かず、「OAuth 期限切れ」という誤った Issue が立つ。
          # 無条件に渡すと失効した API キーが有効な OAuth トークンを握り潰す（ADR 0013）ため、
          # OAuth トークンが空のときだけ渡す。
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: 'Reply with only: OK'
          claude_args: '--max-turns 1'
        continue-on-error: true

      - name: Create issue on failure
        if: steps.claude-auth.outputs.available == 'true' && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          # このジョブは checkout しないため gh はリポジトリを git から解決できない。
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list --label "claude-health" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open health check issue already exists. Skipping."
            exit 0
          fi

          gh issue create \
            --title "fix: Claude Code の認証情報が無効です" \
            --label "claude-health,bug" \
            --body "$(cat <<'BODY'
          ## 問題

          Claude Code Health Check が失敗しました。
          `CLAUDE_CODE_OAUTH_TOKEN`（未設定なら `ANTHROPIC_API_KEY`）が期限切れまたは無効に
          なっている可能性があります。

          ## 対応手順

          1. [Claude Code OAuth](https://console.anthropic.com/) でトークンを再発行
          2. GitHub Settings → Secrets → `CLAUDE_CODE_OAUTH_TOKEN` / `ANTHROPIC_API_KEY` を更新
          3. このワークフローを手動実行して復旧を確認

          ## 影響

          - `claude.yml` (`@claude` メンション) が機能停止
          - `claude-code-review.yml` (AI コードレビュー) が機能停止

          ---
          *このIssueは Claude Code Health Check ワークフローにより自動作成されました。*
          BODY
          )"
