# Quality Gate verifies the latest ci.yml run for the PR head.
# Missing, disabled, failed or unfinished CI never passes. PR size remains enforced.
name: CI Fallback

on:
  pull_request:
    branches: [main, master, pre-production, production]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-fallback
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Enforce PR size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const MAX_LINES = 400;
            const MAX_FILES = 25;
            const OVERRIDE_LABEL = 'size/override';
            const pullRequest = context.payload.pull_request;
            // Dependabot lockfile updates can exceed the review-size limit.
            // Use the PR author so human re-runs also work without label write access.
            if (pullRequest.user?.login === 'dependabot[bot]') {
              core.info('PR size gate skipped for Dependabot; other CI checks still apply.');
              return;
            }

            const totalChanges = pullRequest.additions + pullRequest.deletions;

            core.info(`PR size: ${totalChanges} lines / ${pullRequest.changed_files} files`);
            if (totalChanges <= MAX_LINES && pullRequest.changed_files <= MAX_FILES) {
              return;
            }

            const { data: liveLabels } = await github.rest.issues
              .listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              })
              .catch(() => ({ data: pullRequest.labels }));

            if (liveLabels.some((label) => label.name === OVERRIDE_LABEL)) {
              core.warning(`PR exceeds the size limit but has the '${OVERRIDE_LABEL}' label. Passing.`);
              return;
            }

            core.setFailed(
              `PR size gate failed: ${totalChanges} lines / ${pullRequest.changed_files} files ` +
                `(limit: ${MAX_LINES} lines / ${MAX_FILES} files). ` +
                `Split the PR or have a reviewer apply the '${OVERRIDE_LABEL}' label and re-run.`
            );

      - name: Check if CI workflow ran
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              const { owner, repo } = context.repo;
              const head_sha = context.payload.pull_request.head.sha;
              const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: 'ci.yml' });
              if (workflow.state !== 'active' || workflow.path !== '.github/workflows/ci.yml') {
                throw new Error('ci.yml is absent or disabled');
              }
              const deadline = Date.now() + 4200000;
              do {
                const runs = [];
                let total;
                for (let page = 1; ; page++) {
                  const { data } = await github.rest.actions.listWorkflowRuns({
                    owner, repo, workflow_id: workflow.id, head_sha, per_page: 100, page,
                  });
                  if (!Array.isArray(data.workflow_runs) || !Number.isSafeInteger(data.total_count) || data.total_count < 0) {
                    throw new Error('Invalid CI page schema');
                  }
                  total ??= data.total_count;
                  runs.push(...data.workflow_runs);
                  if (data.total_count !== total || runs.length > total ||
                      (runs.length < total && data.workflow_runs.length === 0)) throw new Error('Incomplete CI pages');
                  if (runs.length === total) break;
                }
                if (runs.some(r => !r || typeof r !== 'object' || !Number.isSafeInteger(r.id) ||
                    r.workflow_id !== workflow.id || r.head_sha !== head_sha ||
                    !Number.isSafeInteger(r.run_number) || !Number.isSafeInteger(r.run_attempt)) ||
                    new Set(runs.map(r => r.id)).size !== runs.length) throw new Error('Invalid or duplicate CI rows');
                const matching = runs.filter(r => r.workflow_id === workflow.id && r.head_sha === head_sha && r.id !== context.runId);
                const order = r => [Date.parse(r.created_at), r.run_number, r.id, r.run_attempt];
                if (matching.some(r => !order(r).every(Number.isFinite))) throw new Error('Invalid CI run metadata');
                matching.sort((a, b) => {
                  const left = order(a), right = order(b);
                  for (let i = 0; i < left.length; i++) if (left[i] !== right[i]) return right[i] - left[i];
                  return 0;
                });
                if (matching.length) {
                  const selected = matching[0];
                  const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: selected.id });
                  if (run.id !== selected.id || run.workflow_id !== workflow.id || run.head_sha !== head_sha ||
                      !Number.isSafeInteger(run.run_attempt) || run.run_attempt < selected.run_attempt) {
                    throw new Error('CI run identity or attempt changed');
                  }
                  if (run.status === 'completed') {
                    if (run.conclusion !== 'success') throw new Error(`CI concluded ${run.conclusion}`);
                    core.info(`CI succeeded: run ${run.id}, attempt ${run.run_attempt}, SHA ${head_sha}`);
                    return;
                  }
                  if (!['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(run.status)) {
                    throw new Error(`Unknown CI status: ${run.status}`);
                  }
                }
                core.info('Waiting for the current head CI run to succeed...');
                await new Promise(resolve => setTimeout(resolve, Math.min(30000, Math.max(0, deadline - Date.now()))));
              } while (Date.now() < deadline);
              throw new Error('CI did not succeed within 4200 seconds (absent or unfinished)');
            } catch (err) {
              core.setFailed(`Quality Gate could not verify CI success: ${err.message}`);
            }
